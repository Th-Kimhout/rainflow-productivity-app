project_id = "twxkbcxudvrwqkkaecks"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# CRITICAL — see supabase/README.md and migration 20260730000500_rls.sql.
# RLS is pinned to app_owner, but signups must ALSO be off. Leaving these true would let
# anyone create an account; they would then fail the app_owner check, but there is no reason
# to leave the door ajar.
enable_signup = false
enable_anonymous_sign_ins = false

# Login is email + password (ADR 0001 decision 12). Length matters far more than composition,
# so the floor is high and the character rules stay moderate — the credential lives in a
# password manager, not in anyone's head.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

# WARNING: `supabase config push` pushes this ENTIRE file, and anything omitted here is filled
# in from CLI defaults — which then overwrite the remote value. The MFA and max_frequency keys
# below are pinned for exactly that reason: leaving them out silently disabled TOTP enrolment
# and dropped the email rate limit from 1m to 1s. Add, don't omit.

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
# Throttles resend spam. Do not lower — the CLI default of 1s is far too permissive.
max_frequency = "60s"

# NOTE: no [auth.email.template.*] block.
#
# Supabase rejects template changes on the free tier with the default email provider:
#   "Email template modification is not available for free tier projects using the default
#    email provider. Please upgrade your plan or configure a custom SMTP provider."
#
# The whole config push fails with a 400 if a template block is present, so this is not merely
# ignored — it blocks everything else in this file from being applied.
#
# Consequence: the default magic-link email does NOT include {{ .Token }}, so there is no
# 6-digit code available and the cross-device PKCE fallback described in ADR 0001 cannot work
# as designed. The template is kept at supabase/templates/magic_link.html for whenever custom
# SMTP is configured. See supabase/README.md for the options.
